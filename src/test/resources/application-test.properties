# Perfil "test": usado pelos testes automatizados (@ActiveProfiles("test")).
# Banco H2 só em memória: não encosta na pasta ./data do site em execução.
spring.datasource.url=jdbc:h2:mem:testes;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.thymeleaf.cache=false

# Os testes usam os dados de demonstração (usuários, anúncios, propostas e uma venda).
app.demo.dados=true
