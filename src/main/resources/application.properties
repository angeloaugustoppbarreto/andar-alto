spring.application.name=andar-alto
server.port=8080

# ---------------------------------------------------------------------
# Banco de dados: H2 em arquivo (pasta ./data), no modo de compatibilidade
# com PostgreSQL. Os dados sobrevivem a reinicializações.
# Para apagar tudo e recomeçar: pare a aplicação e apague a pasta ./data
# ---------------------------------------------------------------------
spring.datasource.url=jdbc:h2:file:./data/andaralto;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=

# O esquema pertence ao Flyway (db/migration): ele cria e evolui as tabelas.
# O Hibernate NÃO mexe no esquema (none). Valores possíveis: none, validate, update, create.
# Evite "update" e "create" fora de testes: eles alteram o banco sem deixar histórico.
# "validate" também é um bom exercício, mas no H2 pode reclamar do tipo das colunas de
# status (o Hibernate espera um tipo "enum" e o esquema usa VARCHAR + CHECK).
spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=true

# Mantém a sessão do banco aberta até a página ser renderizada (simples para
# aprender; em sistemas grandes costuma-se desligar e carregar os dados no service).
spring.jpa.open-in-view=true
# Evita o problema "N+1": ao carregar listas, busca as imagens de vários
# anúncios de uma vez só.
spring.jpa.properties.hibernate.default_batch_fetch_size=20

# Idioma e formato (R$ 1.000,00)
spring.web.locale=pt_BR
spring.web.locale-resolver=fixed

# Em desenvolvimento, alterações nos templates aparecem sem reiniciar
spring.thymeleaf.cache=false

# ---------------------------------------------------------------------
# Regras do negócio e dados iniciais
# ---------------------------------------------------------------------
# Comissão da plataforma sobre cada venda concluída (em %)
app.comissao-percentual=2.0
# Cria 14 anúncios, usuários e propostas FICTÍCIOS na primeira execução.
# Coloque false para começar com o site vazio.
app.demo.dados=true
# Administrador criado automaticamente se ainda não existir nenhum.
# TROQUE a senha antes de qualquer uso real.
app.admin.email=admin@andaralto.com
app.admin.senha=admin123
