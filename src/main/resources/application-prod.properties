# Perfil de PRODUÇÃO ("prod"): só vale quando SPRING_PROFILES_ACTIVE=prod
# (o Dockerfile já define isso). No seu computador, sem o perfil, o site
# continua usando o H2 em arquivo, exatamente como antes.
# Segredos NUNCA ficam neste arquivo: vêm de variáveis de ambiente, que você
# cadastra no painel da hospedagem. Este arquivo pode ir para o GitHub.
server.port=${PORT:8080}
server.forward-headers-strategy=native
server.servlet.session.cookie.secure=true
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.max-lifetime=240000
spring.datasource.hikari.connection-timeout=30000
spring.thymeleaf.cache=true
app.admin.email=${APP_ADMIN_EMAIL:admin@andaralto.com}
app.admin.senha=${APP_ADMIN_SENHA}
app.demo.dados=${APP_DEMO_DADOS:true}
