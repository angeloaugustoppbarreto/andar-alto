# =====================================================================
# Perfil de PRODUÇÃO ("prod"): só vale quando SPRING_PROFILES_ACTIVE=prod
# (o Dockerfile já define isso). No seu computador, sem o perfil, o site
# continua usando o H2 em arquivo, exatamente como antes.
#
# Segredos NUNCA ficam neste arquivo: vêm de variáveis de ambiente, que você
# cadastra no painel da hospedagem. Este arquivo pode ir para o GitHub.
# =====================================================================

# A hospedagem diz em qual porta o site deve escutar (variável PORT).
server.port=${PORT:8080}

# O site fica atrás do proxy HTTPS da hospedagem. Isso faz o Spring entender
# que o acesso original foi https:// (links e redirecionamentos corretos).
server.forward-headers-strategy=native
# O cookie de login só trafega por HTTPS.
server.servlet.session.cookie.secure=true

# ---------------------------------------------------------------------
# Banco PostgreSQL (ex.: Neon). Em hospedagem gratuita o disco é apagado
# quando o site "dorme", então o H2 em arquivo NÃO serve aqui.
#   DATABASE_URL      = jdbc:postgresql://HOST/NOME_DO_BANCO?sslmode=require
#   DATABASE_USERNAME = usuário do banco
#   DATABASE_PASSWORD = senha do banco
# O Flyway cria as tabelas sozinho na primeira subida (db/migration).
# ---------------------------------------------------------------------
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Pool pequeno (poucos recursos). Fecha conexões ociosas depois de 1 min e
# renova as antigas antes de 4 min: bancos gratuitos "dormem" após ~5 min
# sem uso e derrubam conexões paradas.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.max-lifetime=240000
# Dá tempo ao banco de acordar na primeira requisição (30 s).
spring.datasource.hikari.connection-timeout=30000

# Em produção os templates ficam em cache (mais rápido).
spring.thymeleaf.cache=true

# ---------------------------------------------------------------------
# Regras do negócio
# ---------------------------------------------------------------------
app.admin.email=${APP_ADMIN_EMAIL:admin@andaralto.com}
# SEM valor padrão de propósito: se você esquecer de definir APP_ADMIN_SENHA,
# o site se recusa a subir, em vez de ir ao ar com a senha "admin123".
app.admin.senha=${APP_ADMIN_SENHA}
# Vitrine fictícia (14 anúncios + usuários de teste) criada só se o banco estiver vazio.
# Para um site sem dados de demonstração, defina APP_DEMO_DADOS=false.
app.demo.dados=${APP_DEMO_DADOS:true}
